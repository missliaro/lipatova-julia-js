<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практика 3.3</title>
</head>

<body bgcolor="FBF4EE">
  <font color="73230B">
    <h1>Анкета посетителя ресторана</h1>
  </font>
  <form>
    <fieldset>
      <legend>
        <font color="8CE3DC">Контактная информация</font>
      </legend>
      <font color="492F29">
        <table>
          <tr>
            <td width="200"><label width=40>Имя:</label></td>
            <td><input type="text" size="40"></td>
          </tr>

          <tr>
            <td></label>Телефон:</label></td>
            <td><input size="40" type="text"></td>
          </tr>

          <tr>
            <td><label width=30>Email:</label></td>
            <td><input size="40" type="text">
          </tr>
          <tr>
            <td></label>Дата посещения:</label></td>
            <td><input size="40" type="text"></td>
          </tr>
        </table>
      </font>
    </fieldset>

    <br>

    <fieldset>
      <legend>
        <font color="8CE3DC">Персональная информация</font>
      </legend>
      <font color="492F29">
        <table>
          <tr>
            <td width="200"><label>Возраст:</label></td>
            <td><input type="number" min="1" max="100" step="1"></td>
          </tr>
      
          <tr>
            <td></label>Любимая кухня:</label></td>
            <td>
            <select>
              <option>
                Русская
              </option>
              <option>
                Итальянская
              </option>
            </select>
          </td>
          
          </tr>
      
          <tr>
            <td><label width=30>Какие блюда Вы хотели бы увидеть в меню?</label></td>
            <td><textarea name="" id=""></textarea></td>
          </tr>
        </table>
      </font>
    </fieldset>

    <br>
    <fieldset>
      <legend>
        <font color="8CE3DC">Оценка нашего заведения</font>
      </legend>
      <font color="492F29">
      <table>
        <tr>
          <td> <input type="radio">Недалеко от дома\работы</td>
        </tr>
        <tr>
          <td> <input type="radio">Увидел рекламу</td>
          <tr>
            <td> <input type="radio">Посоветовали</td>
          </tr>
        <tr>
          <td> <input type="radio">Оптимальное соотношение цены и качества</td>
        </tr>
      </table>
      <br>
      <label><b>Вы будете рекмендовать наше заведение своим знакомым?</b></label>
      <br> <input type="radio"> <label>Да</label>
      <br> <input type="radio"> <label>Нет</label>
    </font>
    </fieldset>
    <input type="submit" value="Отправить">
  </form>
</body>

</html>
