<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расторопша</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <section class="fon">

    <header class="container">
      <img src="image/logo.png" alt="">
      <nav>
        <a href="#">Главная</a>
        <a href="#">Продукты</a>
        <a href="#">Новости</a>
        <a href="#">Партнеры</a>
        <a href="#">Контакты</a>
      </nav>
    </header>

    <main class="container">
      <div class="main-text">
        <h1><span>Расторопшу</span> Пьём всегда!</h1>
        <p>Далеко-далеко за словесными горами в стране гласных и согласных живут рыбные тексты. Ему он, рыбного
          буквенных о, однажды путь решила которое они океана безорфографичный залетают.</p>
        <a href="#">Смотреть подробнее</a>
      </div>

      <img src="image/img02.png" class="img1">
    </main>

    <div class="main-nav container">
      <img src="image/img01.png" onclick="imgSlider('image/img01.png'); fonColor('#681a74')">
      <img src="image/img02.png" onclick="imgSlider('image/img02.png'); fonColor('#111576')">
      <img src="image/img03.png" onclick="imgSlider('image/img03.png'); fonColor('#77071f')">
    </div>

  </section>

<script type="text/javascript">
function imgSlider(name) {
  document.querySelector('.img1').src = name;
}

function fonColor(color) {
  const f = document.querySelector('.fon')
  f.style.background = color;
}
</script>

</body>

</html>
