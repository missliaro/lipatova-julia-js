<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 практика </title>
</head>

<body>
  <h1 align="center"><u>Анкета</u></h1>
  <form action="">
    <font color=blue>
      <label>Фамилия:</label>
      <br><input type="text" placeholder="Фамилия" required>
      <br><label> Имя:</label>
      <br><input type="text" placeholder="Имя" maxlength="10">
      <br><label>Отчество:</label>
      <br><input type="text" placeholder="Отчество">
      <hr>
      <label>Пароль:</label>
      <br><input type="password">
      <hr>
      <label>Введите дату рождения:</label>
      <br><input type="text" size="1">
      <select>
        <option>Январь</option>
        <option>Февраль</option>
        <option selected>Март</option>
        <option>Апрель</option>
      </select>
      <input type="text" size="3">
      <hr>
      <label>Укажите удобный способ для связи с вами:</label>
      <font color=green>
        <br><input type="radio" name="1"> <input type="tel"> <label>Домашний телефон</label>
        <br><input type="radio" name="1" checked> <input type="tel"> <label>Рабочий телефон</label>
        <br><input type="radio" name="1"> <input type="email"> <label>Электронная почта</label>
      </font>
      <br><label>Расскажите о себе:</label>
      <br><textarea rows="4" cols="25"></textarea>
      <details>
        <summary>
          Как дела?
        </summary>
        <p>Ответ</p>
      </details>
      <hr>
      <br><input type="submit" value="Отправить">
      <input type="reset" value="Сброс">
    </font>

  </form>

</body>

</html>
